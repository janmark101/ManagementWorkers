<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Register</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="ion-text-center ion-margin-vertical">
    <ion-icon name="person-add-outline" style="font-size: 80px; color: var(--ion-color-primary);"></ion-icon>
    <h2>Create Account</h2>
  </div>

  <form (ngSubmit)="onSubmit(form)" #form="ngForm">
    <ion-list lines="none">

      <ion-item class="ion-margin-bottom">
        <ion-input 
          label="Username" 
          label-placement="floating" 
          fill="outline"
          type="text" 
          ngModel 
          name="username" 
          required>
        </ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input 
          label="First Name" 
          label-placement="floating" 
          fill="outline"
          type="text" 
          ngModel 
          name="firstname" 
          required>
        </ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input 
          label="Last Name" 
          label-placement="floating" 
          fill="outline"
          type="text" 
          ngModel 
          name="lastname" 
          required>
        </ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input 
          label="Email" 
          label-placement="floating" 
          fill="outline"
          type="email" 
          ngModel 
          name="email" 
          required>
        </ion-input>
      </ion-item>

      <ion-item class="ion-margin-bottom">
        <ion-input 
          label="Password" 
          label-placement="floating" 
          fill="outline"
          type="password" 
          ngModel 
          name="password" 
          required>
        </ion-input>
      </ion-item>

    </ion-list>

    <div *ngIf="error" class="ion-text-center ion-margin-bottom">
      <ion-text [color]="error === 'Registered succesfully!' ? 'success' : 'danger'">
        <p>{{ error }}</p>
      </ion-text>
    </div>

    <ion-grid>
      <ion-row>
        <ion-col size="12">
          <ion-button expand="block" type="submit" [disabled]="!form.valid">
            Register
          </ion-button>
        </ion-col>
        <ion-col size="12">
          <ion-button expand="block" fill="clear" color="medium" routerLink="/login">
            Already have an account? Log in
          </ion-button>
        </ion-col>
      </ion-row>
    </ion-grid>

  </form>
</ion-content>

<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    
    <ion-title>{{ teamName }}</ion-title>

    <ion-buttons slot="end">
      <ion-button (click)="presentActionSheet()">
        <ion-icon slot="icon-only" name="ellipsis-vertical"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding-bottom">

  <div class="calendar-header ion-padding-top">
    <ion-button fill="clear" (click)="prevMonth()">
      <ion-icon name="chevron-back-outline" size="large"></ion-icon>
    </ion-button>
    
    <h2 class="month-label">{{ dateInformation.currentMonth }} {{ dateInformation.currentYear }}</h2>
    
    <ion-button fill="clear" (click)="nextMonth()">
      <ion-icon name="chevron-forward-outline" size="large"></ion-icon>
    </ion-button>
  </div>

  <div class="ion-text-center ion-margin-bottom">
    <ion-chip (click)="showLegend()" color="medium" outline="true">
      <ion-icon name="information-circle"></ion-icon>
      <ion-label>Legend</ion-label>
    </ion-chip>
  </div>

  <div class="calendar-grid-container">
    <div 
      class="calendar-day" 
      *ngFor="let day of dateInformation.currentMonthDays; let i = index"
      [class.today]="i === dateInformation.currentDay - 1"
      (click)="DisplayDay(i + 1)">
      
      <span class="day-number">{{ i + 1 }}</span>

      <div *ngIf="TaskCounterMap.get(i + 1) != 0" class="task-indicator">
        <fa-icon [icon]="tasks" 
          [style.color]="getTaskColor(TaskCounterMap.get(i + 1))">
        </fa-icon>
      </div>
    </div>
  </div>

  <div class="section-divider">
    <span>Filter by Worker</span>
  </div>

  <ion-list *ngIf="isManager || TeamUsers.length > 0">
    <ion-item *ngFor="let user of TeamUsers; let i = index">
      <ion-checkbox 
        slot="start" 
        [(ngModel)]="user.isChecked" 
        (ionChange)="checkSelectedUser(i)">
      </ion-checkbox>
      <ion-label>
        {{ user.first_name }} {{ user.last_name }}
      </ion-label>
    </ion-item>
  </ion-list>

  <div *ngIf="TeamUsers.length === 0" class="ion-text-center ion-padding">
    <ion-text color="medium"><p>No team members yet.</p></ion-text>
  </div>

</ion-content>

<ion-fab vertical="bottom" horizontal="end" slot="fixed" *ngIf="isManager">
  <ion-fab-button [routerLink]="['/team', teamId, 'add-task']">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>
